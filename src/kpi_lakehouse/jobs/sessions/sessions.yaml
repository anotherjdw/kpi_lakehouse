# Job spec for the sessions ETL job. Generation-time input; never deployed.
# Fill in every value shaped like <...>. Unknown fields and leftover <...> values fail validation.
# To delete this job, delete src/<package>/jobs/sessions/ and its tests:
# tests/unit/sessions/, tests/integration/test_sessions_integration.py,
# tests/end_to_end/test_sessions_e2e.py and tests/fixtures/sessions/.
job:
  name: sessions
  description: Aggregate data source for session events.
  glue:
    worker_type: G.1X
    number_of_workers: 2
  processing:
    type: lookback        # lookback | backfill; applies to every source's dates
    # schedule: cron(0 6 * * ? *)   # optional; AWS cron, UTC; only for a job with no upstream job
  sources:
    - job: session_events
      # job: <job name>   # instead of contract, to read another job's output; create that job first
      alias: session_events
      allow_empty: false  # true lets this source read no rows without failing the run
      # The dates this source reads, if it is partitioned by date; an unpartitioned source sets none.
      lookback_days: 2    # lookback only, 1 when not set: complete days ending yesterday; 0 processes the current date only
  sink:
    contract: sessions   # the output contract: contracts/sessions_data_contract.yaml
    write_mode: overwrite     # the only mode: replaces the partitions present in the output
    partition_key: event_date
  transformations:
    - name: aggregate session events
      description: >
        Group session event data by event_date and session_id, and take the first and last event_ts value, the first mkt_channel value, the last event_type value, the last non-null customer_id value, and the order_id of the purchase.
      inputs: [session_events]
      output:
        grain_change: true
        columns:            # columns this transformation adds; delete the block if none
          - name: session_id
            type: string
            nullable: false
          - name: event_date
            type: date
            nullable: false
          - name: first_event_time
            type: timestamp
            nullable: false
          - name: last_event_time
            type: timestamp
            nullable: true
          - name: first_mkt_channel
            type: string
            nullable: true
          - name: customer_id
            type: string
            nullable: false
          - name: last_event_type
            type: string
            nullable: false
          - name: order_id
            type: string
            nullable: true
        # removes_columns: [<column this transformation drops>]
