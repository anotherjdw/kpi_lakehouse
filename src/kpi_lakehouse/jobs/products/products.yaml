# Job spec for the products ETL job. Generation-time input; never deployed.
# Fill in every value shaped like <...>. Unknown fields and leftover <...> values fail validation.
# To delete this job, delete src/<package>/jobs/products/ and its tests:
# tests/unit/products/, tests/integration/test_products_integration.py,
# tests/end_to_end/test_products_e2e.py and tests/fixtures/products/.
job:
  name: products
  description: Internal product catalog of the items sold.
  glue:
    worker_type: G.1X
    number_of_workers: 2
  processing:
    type: lookback        # lookback | backfill; applies to every source's dates
    # schedule: cron(0 6 * * ? *)   # optional; AWS cron, UTC; only for a job with no upstream job
  sources:
    - contract: products_raw
      # job: <job name>   # instead of contract, to read another job's output; create that job first
      alias: products
      allow_empty: false  # true lets this source read no rows without failing the run
      lookback_days: 7    # lookback only, 1 when not set: complete days ending yesterday; 0 processes the current date only
  sink:
    contract: products   # the output contract: contracts/products_data_contract.yaml
    write_mode: overwrite     # the only mode: replaces the partitions present in the output
    partition_key: snapshot_date
  transformations:
    - name: create tracked columns
      description: >
        is_version_start = not F.struct(tracked).eqNullSafe(its F.lag over a window by product_id ordered by snapshot_date), so null to value is a change and each products's first row is true. tracked: list_price_eur, cost_price_eur, category_id, is_active.
      inputs: [products]
      output:
        grain_change: false
        columns:            # columns this transformation adds; delete the block if none
          - name: is_version_start
            type: boolean
    - name: filter version starts
      description: filter the DataFrame to keep rows `is_version_start` is true, then drop the `is_version_start` column.
      inputs: [ create tracked columns ]
      depends_on: [ create tracked columns ]
      output:
        grain_change: false
        removes_columns: [ is_version_start ]
    - name: add validity window
      description: Create a valid_from column, where valid_from = snapshot_date. Create a valid_to column, where valid_to = F.lead('snapshot_date') over a window partitioned by product_id and ordered by snapshot_date.
      inputs: [ filter version starts ]
      depends_on: [ filter version starts ]
      output:
        grain_change: false
        columns:
          - name: valid_from
            type: date
            nullable: false
          - name: valid_to
            type: date
            nullable: true
    - name: create product version id
      description: Create an SHA256 hashed column called product_version_id, which takes a concatenation product_id and valid_from.
      inputs: [ add validity window ]
      depends_on: [ add validity window ]
      output:
        grain_change: false
        columns:
          - name: product_version_id
            type: string
