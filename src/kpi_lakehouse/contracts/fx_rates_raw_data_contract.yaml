apiVersion: v3.2.0
kind: DataContract
id: fx_rates_raw                   # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
team:
  name: European Central Bank (public feed)
customProperties:
  - property: layer
    value: raw                     # raw | preprocessed | processed
  - property: fileFormat
    value: json
schema:
  - name: fx_rates_raw
    physicalName: fx_rates
    logicalType: object
    description: >
      Euro foreign exchange reference rates published by the European Central Bank. Rates exist only
      for TARGET business days, so weekends and holidays have no partition.
    properties:
      - name: rate_date
        logicalType: date
        physicalType: date
        required: true
        description: Date the rate was published. Partition column.
        primaryKey: true
        partitioned: true
        classification: internal
        examples: [2026-11-03, 2026-10-16]
      - name: base_currency
        logicalType: string
        physicalType: string
        required: true
        description: Always EUR.
        classification: internal
        enum:
          - value: EUR
      - name: quote_currency
        logicalType: string
        physicalType: string
        required: true
        description: ISO 4217 currency quoted, e.g. CHF, PLN, SEK, DKK. EUR itself is not listed.
        primaryKey: true
        classification: internal
        logicalTypeOptions:
          pattern: "^[A-Z]{3}$"
        examples: [ PLN, SEK, CHF ]
      - name: rate
        logicalType: number
        physicalType: decimal(18,8)
        required: true
        description: Units of quote_currency per 1 EUR. An amount converts to EUR as amount / rate.
        classification: internal
        logicalTypeOptions:
          exclusiveMinimum: 0
        examples: [ "4.27310000", "11.52840000", "0.94170000" ]
