apiVersion: v3.2.0
kind: DataContract
id: sessions                       # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
customProperties:
  - property: layer
    value: preprocessed            # raw | preprocessed | processed
  - property: table
    value: hive
schema:
  - name: sessions
    physicalName: sessions
    logicalType: object
    description: Aggregate data source for session events.
    properties:
      - name: session_id
        logicalType: string
        physicalType: string
        required: true
        description: Session the event belongs to; a session ends after 30 minutes of inactivity.
        classification: personal
        primaryKey: true
        examples: [7c1e9a04b2d64f58a3e0c97b15d2f86a, e40b6d2fa91c4387b5d0a6e2c8f71b39]
      - name: event_date
        logicalType: date
        physicalType: date
        required: true
        description: Date of event_ts (UTC). Partition column.
        classification: internal
        primaryKey: true
        examples: [2026-11-02, 2026-10-31]
      - name: first_event_time
        logicalType: timestamp
        physicalType: timestamp
        required: true
        description: Time the first event happened on the client (UTC).
        classification: internal
        examples: ["2026-11-02T19:22:41.093Z", "2026-10-31T07:58:14.516Z"]
      - name: last_event_time
        logicalType: timestamp
        physicalType: timestamp
        required: false
        description: Time the last event happened on the client (UTC).
        classification: internal
        examples: ["2026-11-02T19:41:03.250Z", "2026-10-31T08:12:47.802Z"]
      - name: first_mkt_channel
        logicalType: string
        physicalType: string
        required: false
        description: The first marketing channel from which the customer entered the website.
        classification: internal
        enum:
          - value: paid_search
          - value: paid_social
          - value: affiliate
          - value: email
          - value: organic_search
          - value: referral
          - value: direct
        examples: [ paid_search, email ]
      - name: customer_id
        logicalType: string
        physicalType: string
        required: false
        description: >
          Foreign key to customers.customer_id. Set only after the visitor logs in, so it can change
          within a session.
        classification: personal
        relationships:
          - to: customers.customer_id
        examples: [ C0041877, C0003921 ]
      - name: last_event_type
        logicalType: string
        physicalType: string
        required: true
        description: The last page type the user visited during the session.
        classification: internal
        enum:
          - value: page_view
          - value: product_view
          - value: add_to_cart
          - value: begin_checkout
          - value: purchase
        examples: [ product_view, purchase ]
      - name: order_id
        logicalType: string
        physicalType: string
        required: false
        description: Foreign key to orders.order_id for purchase events.
        classification: internal
        relationships:
          - to: orders.order_id
        examples: [ ORD-000184233, ORD-000007712 ]
