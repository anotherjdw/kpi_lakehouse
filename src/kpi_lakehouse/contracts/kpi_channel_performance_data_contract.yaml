apiVersion: v3.2.0
kind: DataContract
id: kpi_channel_performance        # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
customProperties:
  - property: layer
    value: processed               # raw | preprocessed | processed
  - property: table
    value: hive
schema:
  - name: kpi_channel_performance
    physicalName: kpi_channel_performance
    logicalType: object
    description: >
      One row per day and marketing channel, with sessions, conversions, attributed net revenue, ad
      spend and return on ad spend.
    properties:
      - name: date
        logicalType: date
        physicalType: date
        required: true
        description: >
          Day the sessions started, the orders were placed and the spend was incurred (UTC).
          Partition column.
        classification: internal
        primaryKey: true
        examples: [2026-11-02, 2026-10-14]
      - name: mkt_channel
        logicalType: string
        physicalType: string
        required: false
        description: >
          Marketing channel: paid_search | paid_social | affiliate | email | organic_search |
          referral | direct. Null for sessions fact_session has no channel for.
        classification: internal
        primaryKey: true
        enum:
          - value: paid_search
          - value: paid_social
          - value: affiliate
          - value: email
          - value: organic_search
          - value: referral
          - value: direct
        examples: [ paid_search, email ]
      - name: sessions
        logicalType: integer
        physicalType: bigint
        required: true
        description: Sessions that started on date through mkt_channel. 0 when none.
        classification: internal
        logicalTypeOptions:
          minimum: 0
        examples: [ 1843, 0 ]
      - name: converted_sessions
        logicalType: integer
        physicalType: bigint
        required: true
        description: Sessions among sessions that ended in a purchase. 0 when none.
        classification: internal
        logicalTypeOptions:
          minimum: 0
        examples: [ 52, 0 ]
      - name: attributed_net_revenue_eur
        logicalType: number
        physicalType: decimal(12,2)
        required: true
        description: >
          Net revenue in Euros, excluding VAT, after returns, of the non-cancelled order lines
          placed on date and attributed to mkt_channel. 0.00 when none.
        classification: confidential
        examples: ["4210.55", "0.00"]
      - name: spend_eur
        logicalType: number
        physicalType: decimal(12,2)
        required: true
        description: >
          Ad spend in Euros on date for mkt_channel, at the latest restatement. 0.00 when none.
        classification: confidential
        examples: ["1320.40", "0.00"]
      - name: date_key
        logicalType: integer
        physicalType: int
        required: true
        description: date as yyyyMMdd.
        classification: internal
        relationships:
          - to: dim_dates.date_key
        examples: [ 20261102, 20261014 ]
      - name: conversion_rate
        logicalType: number
        physicalType: decimal(5,4)
        required: false
        description: converted_sessions / sessions. Null when sessions is 0.
        classification: internal
        examples: ["0.0282", "0.0000"]
      - name: roas
        logicalType: number
        physicalType: decimal(12,2)
        required: false
        description: >
          Return on ad spend: attributed_net_revenue_eur / spend_eur. Null when spend_eur is 0.
        classification: confidential
        examples: ["3.19", "0.00"]
