# Source contract products_raw: data no job in this project writes. Describe the files exactly as
# they are on disk. Generation-time input; never deployed.
contract:
  layer: raw                  # raw | preprocessed | processed
  dataset: products
  file_format: json
  partition_key: snapshot_date
  description: >
    Daily full snapshot of the product catalogue from the product information system. Prices,
    costs and category assignments change over time and are only visible by comparing snapshots.
  owner: Product information management (PIM)
  classification:
    contains_pii: false
  freshness:
    cadence: daily
    max_lateness: 1 day
  grain:
    unique_key: [snapshot_date, product_id]
  schema:                     # include the partition column, typed date
    - name: snapshot_date
      type: date
      nullable: false
      description: "Date the snapshot reflects. Partition column."
    - name: product_id
      type: string
      nullable: false
      description: "Natural key of the product."
    - name: sku
      type: string
      nullable: false
      description: "Stock keeping unit printed on the label."
    - name: product_name
      type: string
      nullable: false
      description: "Display name in the shop."
    - name: brand
      type: string
      nullable: false
      description: "Brand name."
    - name: category_id
      type: string
      nullable: false
      description: "Foreign key to categories.category_id, always a leaf category."
    - name: list_price_eur
      type: decimal(12,2)
      nullable: false
      description: "Current list price in EUR including German VAT. Actual charged prices are on order_items."
    - name: cost_price_eur
      type: decimal(12,2)
      nullable: false
      description: "Purchase cost per unit in EUR excluding VAT, used for margin."
    - name: is_active
      type: boolean
      nullable: false
      description: "False once the product is delisted."
    - name: launched_date
      type: date
      nullable: false
      description: "Date the product was first listed."
