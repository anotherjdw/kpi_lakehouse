apiVersion: v3.2.0
kind: DataContract
id: products_raw                   # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
team:
  name: Product information management (PIM)
customProperties:
  - property: layer
    value: raw                     # raw | preprocessed | processed
  - property: fileFormat
    value: json
schema:
  - name: products_raw
    physicalName: products
    logicalType: object
    description: >
      Daily full snapshot of the product catalogue from the product information system. Prices,
      costs and category assignments change over time and are only visible by comparing snapshots.
    properties:
      - name: snapshot_date
        logicalType: date
        physicalType: date
        required: true
        description: Date the snapshot reflects. Partition column.
        classification: internal
        primaryKey: true
        partitioned: true
        examples: [2026-11-05, 2026-10-21]
      - name: product_id
        logicalType: string
        physicalType: string
        required: true
        description: Natural key of the product.
        primaryKey: true
        classification: internal
        logicalTypeOptions:
          pattern: "^P[0-9]{5}$"
        examples: [ P00412, P00093 ]
      - name: sku
        logicalType: string
        physicalType: string
        required: true
        description: Stock keeping unit printed on the label.
        classification: internal
        logicalTypeOptions:
          pattern: "^SKU-[A-Z]{2}-[0-9]{6}$"
        examples: [ SKU-SP-000412, SKU-HO-000093 ]
      - name: product_name
        logicalType: string
        physicalType: string
        required: true
        description: Display name in the shop.
        classification: internal
        examples: [Trail Runner 2, Linen Tea Towel Set, Arc Desk Lamp]
      - name: brand
        logicalType: string
        physicalType: string
        required: true
        description: Brand name.
        classification: internal
        examples: [Nordwind, Fjell & Sons]
      - name: category_id
        logicalType: string
        physicalType: string
        required: true
        description: Foreign key to categories.category_id, always a leaf category.
        classification: internal
        logicalTypeOptions:
          pattern: "^CAT-[0-9]{4}$"
        relationships:
          - to: categories_raw.category_id
        examples: [ CAT-0031, CAT-0007 ]
      - name: list_price_eur
        logicalType: number
        physicalType: decimal(12,2)
        required: true
        description: >
          Current list price in EUR including German VAT. Actual charged prices are on order_items.
        classification: internal
        logicalTypeOptions:
          minimum: 0
        examples: [ "89.95", "14.50" ]
      - name: cost_price_eur
        logicalType: number
        physicalType: decimal(12,2)
        required: true
        description: Purchase cost per unit in EUR excluding VAT, used for margin.
        classification: internal
        logicalTypeOptions:
          minimum: 0
        examples: [ "31.20", "4.85" ]
      - name: is_active
        logicalType: boolean
        physicalType: boolean
        required: true
        description: False once the product is delisted.
        classification: internal
        examples: [true, false]
      - name: launched_date
        logicalType: date
        physicalType: date
        required: true
        description: Date the product was first listed.
        classification: internal
        examples: [2026-04-01, 2026-06-27]
