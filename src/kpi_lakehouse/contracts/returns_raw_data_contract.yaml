apiVersion: v3.2.0
kind: DataContract
id: returns_raw                    # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
team:
  name: Warehouse management system
customProperties:
  - property: layer
    value: raw                     # raw | preprocessed | processed
  - property: fileFormat
    value: jsonl
schema:
  - name: returns_raw
    physicalName: returns
    logicalType: object
    description: >
      Return records per order line from the warehouse management system, exported each time a
      return changes status. Customers have 30 days after delivery to return, so a return can first
      appear up to about 45 days after the order was placed.
    properties:
      - name: export_date
        logicalType: date
        physicalType: date
        required: true
        description: Date the record was exported. Partition column.
        classification: internal
        partitioned: true
        examples: [2026-05-01, 2026-10-11]
      - name: return_id
        logicalType: string
        physicalType: string
        required: true
        description: Natural key of the return.
        classification: internal
        primaryKey: true
        logicalTypeOptions:
          pattern: "^RET-[0-9]{8}$"
        examples: [ RET-00004417, RET-00000958 ]
      - name: order_id
        logicalType: string
        physicalType: string
        required: true
        description: Foreign key to orders.order_id.
        classification: internal
        logicalTypeOptions:
          pattern: "^ORD-[0-9]{9}$"
        relationships:
          - to: orders_raw.order_id
        examples: [ ORD-000184233, ORD-000007712 ]
      - name: line_number
        logicalType: integer
        physicalType: int
        required: true
        description: With order_id, foreign key to order_items.
        classification: internal
        logicalTypeOptions:
          minimum: 1
        examples: [ 1, 2 ]
      - name: product_id
        logicalType: string
        physicalType: string
        required: true
        description: Foreign key to products.product_id; repeats the order line's product.
        classification: internal
        logicalTypeOptions:
          pattern: "^P[0-9]{5}$"
        relationships:
          - to: products_raw.product_id
        examples: [ P00412, P00093 ]
      - name: requested_ts
        logicalType: timestamp
        physicalType: timestamp
        required: true
        description: Time the customer registered the return (UTC).
        classification: internal
        examples: ["2026-11-05T16:42:30.118Z", "2026-10-27T09:03:12.640Z"]
      - name: quantity_returned
        logicalType: integer
        physicalType: int
        required: true
        description: Units returned; at most the order line's quantity.
        classification: internal
        logicalTypeOptions:
          minimum: 1
        examples: [1, 2]
      - name: refund_amount
        logicalType: number
        physicalType: decimal(12,2)
        required: false
        description: >
          Amount refunded in the order's currency, including VAT. Null until return_status is
          refunded.
        classification: internal
        examples: ["59.95", "120.00"]
      - name: return_reason
        logicalType: string
        physicalType: string
        required: true
        description: Why the customer returned the item.
        classification: internal
        enum:
          - value: wrong_size
          - value: damaged
          - value: not_as_described
          - value: changed_mind
          - value: other
        examples: [ wrong_size, changed_mind ]
      - name: return_status
        logicalType: string
        physicalType: string
        required: true
        description: Status of this version of the return.
        classification: internal
        enum:
          - value: requested
          - value: received
          - value: refunded
          - value: rejected
        examples: [ requested, refunded ]
      - name: updated_at
        logicalType: timestamp
        physicalType: timestamp
        required: true
        description: >
          Time this status version was written (UTC). The latest version per return_id is the
          current one.
        primaryKey: true
        classification: internal
        examples: ["2026-11-06T02:10:55.371Z", "2026-10-29T02:11:03.904Z"]
