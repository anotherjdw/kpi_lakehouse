apiVersion: v3.2.0
kind: DataContract
id: customers_raw                  # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
team:
  name: CRM
customProperties:
  - property: layer
    value: raw                     # raw | preprocessed | processed
  - property: fileFormat
    value: jsonl
schema:
  - name: customers_raw
    physicalName: customers
    logicalType: object
    description: >
      Daily full snapshot of the customer master from the CRM. Attribute changes are visible only by
      comparing consecutive snapshots. After a GDPR erasure request, is_deleted is true and every
      personal field is null in that and all later snapshots.
    properties:
      - name: snapshot_date
        logicalType: date
        physicalType: date
        required: true
        description: Date the snapshot reflects. Partition column.
        classification: internal
        primaryKey: true
        partitioned: true
        examples: [2026-10-21, 2026-11-05]
      - name: customer_id
        logicalType: string
        physicalType: string
        required: true
        description: Natural key of the customer. Kept after erasure.
        classification: personal
        primaryKey: true
        logicalTypeOptions:
          pattern: "^C[0-9]{7}$"
        examples: [ C0041877, C0003921 ]
      - name: email
        logicalType: string
        physicalType: string
        required: false
        description: Login email address. Null after erasure.
        classification: personal
        examples: [anna.kowalska@example.com, j.lindqvist@example.org]
      - name: first_name
        logicalType: string
        physicalType: string
        required: false
        description: First name. Null after erasure.
        classification: personal
        examples: [Anna, Jonas, Mette]
      - name: last_name
        logicalType: string
        physicalType: string
        required: false
        description: Last name. Null after erasure.
        classification: personal
        examples: [Kowalska, Lindqvist, Sørensen]
      - name: date_of_birth
        logicalType: date
        physicalType: date
        required: false
        description: Date of birth, optional at signup. Null after erasure.
        classification: personal
        examples: [1988-03-14, 1972-11-02]
      - name: signup_ts
        logicalType: timestamp
        physicalType: timestamp
        required: true
        description: Time the account was created (UTC).
        classification: internal
        examples: ["2024-06-11T18:27:40.512Z", "2026-02-03T08:05:19.090Z"]
      - name: country_code
        logicalType: string
        physicalType: string
        required: false
        description: ISO 3166-1 alpha-2 country of the default address. Null after erasure.
        classification: internal
        logicalTypeOptions:
          pattern: "^[A-Z]{2}$"
        examples: [ PL, SE, DK ]
      - name: city
        logicalType: string
        physicalType: string
        required: false
        description: City of the default address. Null after erasure.
        classification: personal
        examples: [Kraków, Malmö, Aarhus]
      - name: postal_code
        logicalType: string
        physicalType: string
        required: false
        description: Postal code of the default address. Null after erasure.
        classification: personal
        examples: [30-059, 211 45, "8000"]
      - name: customer_segment
        logicalType: string
        physicalType: string
        required: true
        description: standard | plus (paid membership) | business. Can change over time.
        classification: internal
        enum:
          - value: standard
          - value: plus
          - value: business
        examples: [ standard, plus ]
      - name: marketing_opt_in
        logicalType: boolean
        physicalType: boolean
        required: true
        description: Whether the customer consents to marketing email. Can change over time.
        classification: internal
        examples: [true, false]
      - name: is_deleted
        logicalType: boolean
        physicalType: boolean
        required: true
        description: True once the customer requested erasure under GDPR Art. 17.
        classification: internal
        examples: [true, false]
