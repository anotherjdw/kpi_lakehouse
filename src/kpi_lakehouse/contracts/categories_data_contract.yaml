# Output contract of the categories ETL job: the dataset it writes. Generation-time input;
# never deployed. Fill in every value shaped like <...>.
contract:
  layer: preprocessed
  dataset: category
  description: Internal flattened catalog of product categories.
  table: hive               # a Hive table over this dataset; needs sink.partition_key and
                            # snake_case dataset and column names
  grain:
    unique_key: [category_id]
  schema:
    - name: snapshot_date
      type: date
      nullable: false
      description: "Date the snapshot reflects. Partition column."
    - name: category_id
      type: string
      nullable: false
      description: "Natural key of the category."
    - name: category_name
      type: string
      nullable: false
      description: "Display name, e.g. Running Shoes."
    - name: parent_category_id
      type: string
      nullable: true
      description: "category_id of the parent. Null for a root category."
    - name: is_active
      type: boolean
      nullable: false
      description: "False once the category is retired; retired categories stay for history."
    - name: updated_at
      type: timestamp
      nullable: false
      description: "Time the category was last changed (UTC)."
    - name: category_id_level_1
      type: string
      nullable: false
      description: "First level parent category of the category_id."
    - name: category_id_level_2
      type: string
      nullable: true
      description: "Second level parent category of the category_id."
    - name: category_id_level_3
      type: string
      nullable: true
      description: "Third level parent category of the category_id."
    - name: category_id_level_4
      type: string
      nullable: true
      description: "Fourth level parent category of the category_id."
