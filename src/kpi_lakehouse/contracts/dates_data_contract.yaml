apiVersion: v3.2.0
kind: DataContract
id: dates                          # the contract's name: its file name without _data_contract.yaml
version: 1.0.0
customProperties:
  - property: layer
    value: raw                     # raw | preprocessed | processed
  - property: fileFormat
    value: jsonl
schema:
  - name: dates
    physicalName: dates
    logicalType: object
    properties:
      - name: date
        logicalType: date
        physicalType: date
        required: true
        classification: internal
        examples: [ 2026-11-02, 2026-10-14 ]
